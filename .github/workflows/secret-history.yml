name: Redacted full-history secret scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks-history:
    name: secrets-history
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan Git history without exposing findings in public logs
        shell: bash
        run: |
          # The repo is public, but candidate secrets must never be printed to
          # GitHub Actions logs, uploaded as artifacts or added as PR comments.
          # Pin the official multi-arch Gitleaks container to an immutable digest.
          umask 077
          report="$RUNNER_TEMP/secret-history-internal.json"
          trap 'rm -f "$report"' EXIT
          set +e
          docker run --rm --network none \
            -v "$PWD:/repo:ro" -v "$RUNNER_TEMP:/private-report" -w /repo \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --redact --no-banner --report-format json --report-path /private-report/secret-history-internal.json >/dev/null 2>&1
          result=$?
          set -e
          if [ "$result" -eq 0 ]; then
            echo "Secret-history scan completed: no matches under current rules."
          elif [ "$result" -eq 1 ]; then
            # Emit ONLY aggregate rule IDs, never matches, paths, commit IDs or
            # snippets. The temporary redacted report is deleted on exit.
            python3 - "$report" <<'PY'
          import collections
          import json
          import pathlib
          import re
          import sys
          try:
              findings = json.loads(pathlib.Path(sys.argv[1]).read_text())
              counts = collections.Counter(
                  f.get("RuleID", "unknown") for f in findings
                  if isinstance(f, dict)
              )
              print(f"Potential finding count: {sum(counts.values())}")
              for key, count in sorted(counts.items()):
                  if isinstance(key, str) and re.fullmatch(r"[A-Za-z0-9_-]{1,80}", key):
                      print(f"Rule type: {key} ({count})")
          except (OSError, ValueError, TypeError):
              print("A private report could not be inspected.")
          PY
            echo "::error::Potential secret found in Git history. Review privately with the maintainer; rotate exposed credentials. No finding details are published."
            exit 1
          else
            echo "::error::History scanner failed (exit code $result); no clean-scan conclusion is possible."
            exit 1
          fi
